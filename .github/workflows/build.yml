name: Build Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t ghcr.io/boofinka/skywatch-backend:${{ github.sha }} \
            ./backend

      - name: Push backend
        run: |
          docker push \
            ghcr.io/boofinka/skywatch-backend:${{ github.sha }}

      - name: Build frontend
        run: |
          docker build \
            -t ghcr.io/boofinka/skywatch-frontend:${{ github.sha }} \
            ./frontend

      - name: Push frontend
        run: |
          docker push \
            ghcr.io/boofinka/skywatch-frontend:${{ github.sha }}
      - name: Push frontend
        run: |
          docker push \
            ghcr.io/boofinka/skywatch-frontend:${{ github.sha }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          yq -i '.frontend.image.tag = env(IMAGE_TAG)' helm/skywatch/values.yaml
          yq -i '.backend.image.tag = env(IMAGE_TAG)' helm/skywatch/values.yaml
      - name: Commit updated image tags
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/skywatch/values.yaml

          git diff --cached --quiet && exit 0

          git commit -m "chore: update image tags [skip ci]"
          git push