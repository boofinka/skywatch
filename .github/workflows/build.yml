name: Build Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t ghcr.io/boofinka/skywatch-backend:${{ github.sha }} \
            ./backend

      - name: Push backend
        run: |
          docker push \
            ghcr.io/boofinka/skywatch-backend:${{ github.sha }}

      - name: Build frontend
        run: |
          docker build \
            -t ghcr.io/boofinka/skywatch-frontend:${{ github.sha }} \
            ./frontend

      - name: Push frontend
        run: |
          docker push \
            ghcr.io/boofinka/skywatch-frontend:${{ github.sha }}