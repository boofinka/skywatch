---
- name: Check if K3s agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

- name: Install K3s agent
  shell: |
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_URL=https://{{ hostvars[groups['k3s_server'][0] | default(groups['control'][0])].ansible_host }}:6443 \
    K3S_TOKEN={{ hostvars[groups['k3s_server'][0] | default(groups['control'][0])].k3s_join_token }} \
    sh -
  become: true
  when: not k3s_agent_binary.stat.exists
