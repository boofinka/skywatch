frontend:
  replicaCount: 1

  image:
    repository: ghcr.io/boofinka/skywatch-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

backend:
  replicaCount: 1

  image:
    repository: ghcr.io/boofinka/skywatch-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5000

ingress:
  enabled: true
  className: traefik
  host: skywatch.local

backendUrl: http://skywatch-backend:5000